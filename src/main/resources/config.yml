
# ==========================================
#                 JoinPlus
#          Professional Configuration
# ==========================================

settings:
  prefix: "<gradient:#00FFFF:#8000FF>[JoinPlus]</gradient>"

join:
  enabled: true
  message: "<green>+ <white>%player% <gray>joined the server!"
  broadcast: true

quit:
  enabled: true
  message: "<red>- <white>%player% <gray>left the server!"
  broadcast: true

first-join:
  enabled: true
  message: "<gradient:#FFD700:#FF8C00>Welcome %player%!</gradient> <gray>Enjoy your first adventure!"
  broadcast: true

  title:
    enabled: true
    title: "<gradient:#00FFFF:#8000FF><bold>WELCOME!</bold></gradient>"
    subtitle: "<white>Welcome to <aqua>Our Server</aqua>"
    fade-in: 10
    stay: 60
    fade-out: 20

  sound:
    enabled: true
    name: "ENTITY_PLAYER_LEVELUP"
    volume: 1.0
    pitch: 1.0

messages:
  no-permission: "<red>You don't have permission!"
  reload: "<green>JoinPlus configuration reloaded!"
  player-only: "<red>This command can only be used by players!"
  unknown-command: "<red>Unknown command! Use <yellow>/joinplus help"
  prefix: "<dark_gray>[<aqua>JoinPlus<dark_gray>] "

# ==========================================
#                 END
# ==========================================
