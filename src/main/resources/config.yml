
# ==========================================
#                 JoinPlus
#          Professional Configuration
# ==========================================

settings:
  prefix: "<gradient:#00FFFF:#8000FF>[JoinPlus]</gradient>"

update-checker:
  enabled: true
  notify-console: true
  notify-admins: true

join:
  enabled: true
  message: "<green>+ <white>%player% <gray>joined the server!"
  broadcast: true

  actionbar:
    enabled: true
    message: "<gradient:#00FFFF:#8000FF>Welcome back, %player%!</gradient>"

  particles:
    enabled: false
    type: HAPPY_VILLAGER
    count: 20
    offset-x: 0.5
    offset-y: 1.0
    offset-z: 0.5

  items:
    enabled: false
    list:
      compass:
        material: COMPASS
        amount: 1
        name: "<aqua>Server Navigator"

quit:
  enabled: true
  message: "<red>- <white>%player% <gray>left the server!"
  broadcast: true

first-join:
  enabled: true
  message: "<gradient:#FFD700:#FF8C00>Welcome %player%!</gradient> <gray>Enjoy your first adventure!"
  broadcast: true

  title:
    enabled: true
    title: "<gradient:#00FFFF:#8000FF><bold>WELCOME!</bold></gradient>"
    subtitle: "<white>Welcome to <aqua>Our Server</aqua>"
    fade-in: 10
    stay: 60
    fade-out: 20

  actionbar:
    enabled: true
    message: "<gradient:#FFD700:#FF8C00>Welcome to the server, %player%!</gradient>"

  sound:
    enabled: true
    name: "ENTITY_PLAYER_LEVELUP"
    volume: 1.0
    pitch: 1.0

  particles:
    enabled: true
    type: TOTEM_OF_UNDYING
    count: 30
    offset-x: 0.7
    offset-y: 1.0
    offset-z: 0.7

  items:
    enabled: true
    list:
      welcome-compass:
        material: COMPASS
        amount: 1
        name: "<gradient:#00FFFF:#8000FF>Welcome Compass</gradient>"
      welcome-apple:
        material: GOLDEN_APPLE
        amount: 2
        name: "<gold>Welcome Gift"

permission-messages:
  enabled: true

  groups:
    owner:
      permission: "joinplus.group.owner"
      priority: 100
      join: "<dark_gray>[<red>OWNER</red><dark_gray>] <white>%player% joined!"
      quit: "<dark_gray>[<red>OWNER</red><dark_gray>] <white>%player% left!"

    admin:
      permission: "joinplus.group.admin"
      priority: 90
      join: "<dark_gray>[<gold>ADMIN</gold><dark_gray>] <white>%player% joined!"
      quit: "<dark_gray>[<gold>ADMIN</gold><dark_gray>] <white>%player% left!"

    media:
      permission: "joinplus.group.media"
      priority: 80
      join: "<dark_gray>[<light_purple>MEDIA</light_purple><dark_gray>] <white>%player% joined!"
      quit: "<dark_gray>[<light_purple>MEDIA</light_purple><dark_gray>] <white>%player% left!"

messages:
  no-permission: "<red>You don't have permission!"
  reload: "<green>JoinPlus configuration reloaded!"
  player-only: "<red>This command can only be used by players!"
  unknown-command: "<red>Unknown command! Use <yellow>/joinplus help"
  prefix: "<dark_gray>[<aqua>JoinPlus<dark_gray>] "

# ==========================================
#                 END
# ==========================================
